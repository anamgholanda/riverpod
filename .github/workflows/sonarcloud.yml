name: sonarcloud

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: Análise SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter (inclui Dart)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar SonarScanner CLI (nativo no runner)
        run: |
          SCANNER_VERSION="6.2.1.4610"
          curl -sSLo sonar-scanner.zip "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
          unzip -q sonar-scanner.zip -d /opt/sonar-scanner
          echo "/opt/sonar-scanner/sonar-scanner-${SCANNER_VERSION}-linux-x64/bin" >> "$GITHUB_PATH"
          rm sonar-scanner.zip

      - name: Ferramenta de cobertura para pacotes Dart
        run: dart pub global activate coverage

      # 1. Resolve o workspace na raiz (se existir) e os pacotes em packages/
      - name: Resolver dependências e gerar código dos pacotes
        run: |
          set -uo pipefail
          ok=0; failed=0
          : > "$RUNNER_TEMP/pub_failed.txt"

          if [ -f "pubspec.yaml" ]; then
            echo "::group::pub get na raiz (workspace)"
            flutter pub get || echo "::warning::pub get na raiz falhou"
            echo "::endgroup::"
          fi

          while IFS= read -r pubspec; do
            pkg="$(dirname "$pubspec")"
            echo "::group::Dependências em $pkg"
            # Se o pacote NÃO faz parte de um Pub Workspace, roda pub get nele
            if ! grep -q "resolution: workspace" "$pubspec"; then
              if (cd "$pkg" && flutter pub get); then
                ok=$((ok+1))
              else
                failed=$((failed+1))
                echo "$pkg" >> "$RUNNER_TEMP/pub_failed.txt"
                echo "::warning::pub get falhou em $pkg"
              fi
            else
              ok=$((ok+1))
            fi

            if grep -q "build_runner:" "$pubspec"; then
              (cd "$pkg" && dart run build_runner build --delete-conflicting-outputs) || \
                echo "::warning::build_runner falhou em $pkg"
            fi
            echo "::endgroup::"
          done < <(find packages -name pubspec.yaml \
                     -not -path "*/.dart_tool/*" \
                     -not -path "*/build/*" \
                     -not -path "*/ephemeral/*" \
                     -not -path "*/.symlinks/*" \
                     -not -path "*/node_modules/*" \
                     -not -path "*/example/*" \
                     -not -path "*/integration/*" | sort)

          echo "Resolvidos: $ok | Falharam: $failed"

      # 2. Testes com cobertura
      - name: Testes com cobertura (todos os pacotes)
        run: |
          set -uo pipefail
          export PATH="$PATH:$HOME/.pub-cache/bin"
          mkdir -p "$RUNNER_TEMP/cov"
          : > "$RUNNER_TEMP/cov/lcov.info"

          while IFS= read -r pubspec; do
            pkg="$(dirname "$pubspec")"
            [ -d "$pkg/test" ] || continue

            echo "::group::$pkg"
            (
              cd "$pkg"
              if grep -q "sdk: flutter" pubspec.yaml; then
                flutter test --coverage
              else
                dart test --coverage=coverage
                dart pub global run coverage:format_coverage \
                  --lcov --in=coverage --out=coverage/lcov.info \
                  --report-on=lib
              fi
            ) || echo "::warning::Falha nos testes de $pkg"

            if [ -f "$pkg/coverage/lcov.info" ]; then
              sed "s|^SF:|SF:${pkg#./}/|" "$pkg/coverage/lcov.info" >> "$RUNNER_TEMP/cov/lcov.info"
            fi
            echo "::endgroup::"
          done < <(find packages -name pubspec.yaml \
                     -not -path "*/.dart_tool/*" \
                     -not -path "*/build/*" \
                     -not -path "*/ephemeral/*" \
                     -not -path "*/.symlinks/*" \
                     -not -path "*/node_modules/*" \
                     -not -path "*/example/*" \
                     -not -path "*/integration/*" | sort)

          mkdir -p coverage
          cp "$RUNNER_TEMP/cov/lcov.info" coverage/lcov.info

      # 3. Diagnóstico rápido antes do scan (aparece nos logs do GitHub Actions)
      - name: Verificar configuração Dart/Flutter antes do Sonar
        run: |
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"
          echo "PUB_CACHE=$PUB_CACHE"
          ls -la .dart_tool/package_config.json || true

      # 4. Executa o SonarScanner nativamente no mesmo ambiente do Flutter/Dart
      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=anamgholanda \
            -Dsonar.projectKey=anamgholanda_riverpod \
            -Dsonar.projectName=riverpod \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.sources=packages \
            -Dsonar.inclusions=packages/**/lib/**/*.dart \
            -Dsonar.exclusions=**/example/**,**/integration/**,**/*.g.dart,**/*.freezed.dart,**/generated/**,**/build/**,**/ephemeral/** \
            -Dsonar.tests=packages \
            -Dsonar.test.inclusions=packages/**/test/**/*.dart \
            -Dsonar.dart.flutter.sdk="$FLUTTER_ROOT" \
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}