name: sonarcloud

on:
  push:
    branches: [master, main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: Análise SonarCloud
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Mantém o PUB_CACHE dentro do workspace para que o container Docker do Sonar enxergue os pacotes
      PUB_CACHE: ${{ github.workspace }}/.pub-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo, necessário para o Sonar[cite: 3]

      - name: Setup Flutter (inclui Dart)
        id: flutter-setup
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Copia/vincula o Flutter SDK para dentro do workspace para ficar visível dentro do container Docker do Sonar
      - name: Disponibilizar Flutter SDK dentro do workspace para o container Sonar
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.flutter-sdk"
          cp -a "$FLUTTER_ROOT/." "$GITHUB_WORKSPACE/.flutter-sdk/"
          echo "FLUTTER_ROOT=$GITHUB_WORKSPACE/.flutter-sdk" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.flutter-sdk/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Ferramenta de cobertura para pacotes Dart
        run: dart pub global activate coverage

      # Se existir pubspec.yaml na raiz (Dart Pub Workspace), resolve a raiz primeiro;
      # depois resolve e gera código em cada pacote individual
      - name: Resolver dependências e gerar código dos pacotes
        run: |
          set -uo pipefail
          ok=0; failed=0
          : > "$RUNNER_TEMP/pub_failed.txt"

          if [ -f "pubspec.yaml" ]; then
            echo "::group::Dependências na raiz (workspace)"
            flutter pub get || echo "::warning::pub get na raiz falhou"
            echo "::endgroup::"
          fi

          while IFS= read -r pubspec; do
            pkg="$(dirname "$pubspec")"
            echo "::group::Dependências em $pkg"
            if (cd "$pkg" && flutter pub get); then
              ok=$((ok+1))
              if grep -q "build_runner:" "$pubspec"; then
                (cd "$pkg" && dart run build_runner build --delete-conflicting-outputs) || \
                  echo "::warning::build_runner falhou em $pkg"
              fi
            else
              failed=$((failed+1))
              echo "$pkg" >> "$RUNNER_TEMP/pub_failed.txt"
              echo "::warning::pub get falhou em $pkg"
            fi
            echo "::endgroup::"
          done < <(find packages -name pubspec.yaml \
                     -not -path "*/.dart_tool/*" \
                     -not -path "*/build/*" \
                     -not -path "*/ephemeral/*" \
                     -not -path "*/.symlinks/*" \
                     -not -path "*/node_modules/*" \
                     -not -path "*/example/*" | sort)

          {
            echo "### Resolução de dependências"
            echo "- Pacotes resolvidos: $ok"
            echo "- Pacotes com falha: $failed"
            if [ "$failed" -gt 0 ]; then
              echo ""; echo "Sem dependências resolvidas:"; echo '```'
              cat "$RUNNER_TEMP/pub_failed.txt"; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Unifica todos os package_config.json (incluindo os pacotes internos do monorepo)
      # e ajusta os caminhos absolutos do runner para o caminho montado no container Docker (/github/workspace)
      - name: Unificar package_config.json para o SonarScanner
        run: |
          python3 - <<'EOF'
          import json, glob, os

          workspace = os.environ["GITHUB_WORKSPACE"]

          def fix_uri(uri, base_dir):
              if uri.startswith("file://"):
                  # Converte /home/runner/work/repo/repo/... para relativo
                  path = uri.replace("file://", "")
                  if path.startswith(workspace):
                      return os.path.relpath(path, base_dir)
                  return uri
              return uri

          def write_merged(target_dir):
              merged_packages = {}
              dart_tool_dir = os.path.join(target_dir, ".dart_tool") if target_dir != "." else ".dart_tool"
              os.makedirs(dart_tool_dir, exist_ok=True)

              configs = sorted(glob.glob("packages/**/.dart_tool/package_config.json", recursive=True))
              if os.path.exists(".dart_tool/package_config.json"):
                  configs.insert(0, ".dart_tool/package_config.json")

              for cfg_path in configs:
                  if "/example/" in cfg_path or "/integration/" in cfg_path:
                      continue
                  pkg_dir = os.path.dirname(os.path.dirname(cfg_path))
                  with open(cfg_path, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  for pkg in data.get("packages", []):
                      name = pkg["name"]
                      root_uri = pkg["rootUri"]
                      if root_uri.startswith("file://"):
                          abs_root = root_uri.replace("file://", "")
                      else:
                          abs_root = os.path.normpath(os.path.join(pkg_dir, ".dart_tool", root_uri))

                      # Torna todos os caminhos relativos ao dart_tool_dir (funciona dentro e fora do Docker)
                      pkg["rootUri"] = os.path.relpath(abs_root, dart_tool_dir)

                      # Prioriza pacotes locais de packages/ quando for pacote do próprio monorepo
                      local_pkg_path = os.path.abspath(os.path.join("packages", name))
                      if os.path.isdir(local_pkg_path):
                          pkg["rootUri"] = os.path.relpath(local_pkg_path, dart_tool_dir)
                          pkg["packageUri"] = "lib/"

                      if name not in merged_packages or ".pub-cache" in pkg["rootUri"]:
                          merged_packages[name] = pkg

              out = {
                  "configVersion": 2,
                  "packages": list(merged_packages.values()),
                  "generator": "pub"
              }
              with open(os.path.join(dart_tool_dir, "package_config.json"), "w", encoding="utf-8") as f:
                  json.dump(out, f, indent=2)
              print(f"Total de pacotes unificados em {dart_tool_dir}: {len(merged_packages)}")

          write_merged(".")
          write_merged("packages")
          EOF

      - name: Testes com cobertura (todos os pacotes)
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/cov"
          : > "$RUNNER_TEMP/cov/lcov.info"

          while IFS= read -r pubspec; do
            pkg="$(dirname "$pubspec")"
            [ -d "$pkg/test" ] || continue

            echo "::group::$pkg"
            (
              cd "$pkg"
              if grep -q "sdk: flutter" pubspec.yaml; then
                flutter test --coverage
              else
                dart test --coverage=coverage
                dart pub global run coverage:format_coverage \
                  --lcov --in=coverage --out=coverage/lcov.info \
                  --report-on=lib --packages=.dart_tool/package_config.json
              fi
            ) || echo "::warning::Falha nos testes de $pkg"

            if [ -f "$pkg/coverage/lcov.info" ]; then
              sed "s|^SF:|SF:${pkg#./}/|" "$pkg/coverage/lcov.info" >> "$RUNNER_TEMP/cov/lcov.info"
            fi
            echo "::endgroup::"
          done < <(find packages -name pubspec.yaml \
                     -not -path "*/.dart_tool/*" \
                     -not -path "*/build/*" \
                     -not -path "*/ephemeral/*" \
                     -not -path "*/.symlinks/*" \
                     -not -path "*/node_modules/*" \
                     -not -path "*/example/*" | sort)

          mkdir -p coverage
          cp "$RUNNER_TEMP/cov/lcov.info" coverage/lcov.info

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          FLUTTER_ROOT: /github/workspace/.flutter-sdk
          PUB_CACHE: /github/workspace/.pub-cache
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=anamgholanda
            -Dsonar.projectKey=anamgholanda_riverpod
            -Dsonar.projectName=riverpod
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.sources=packages
            -Dsonar.inclusions=packages/**/lib/**/*.dart
            -Dsonar.exclusions=**/example/**,**/integration/**,**/*.g.dart,**/*.freezed.dart,**/generated/**,**/build/**,**/ephemeral/**,**/.flutter-sdk/**,**/.pub-cache/**
            -Dsonar.tests=packages
            -Dsonar.test.inclusions=packages/**/test/**/*.dart
            -Dsonar.dart.flutter.sdk=/github/workspace/.flutter-sdk
            -Dsonar.dart.lcov.reportPaths=coverage/lcov.info

      - name: Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}